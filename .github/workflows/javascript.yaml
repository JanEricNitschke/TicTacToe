# This workflow will run lints on the javascript version of tictactoe

name: javascript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install prettier
        run: npm i prettier --save-dev
      - name: Prettier
        run: ./node_modules/.bin/prettier --check "./tictactoe_javascript/**.{css,js}"
      - name: Install eslint
        run: |
          npm i eslint --save-dev
          npm install @babel/core @babel/eslint-parser --save-dev
          npm install
      - name: Lint
        run: ./node_modules/.bin/eslint .
