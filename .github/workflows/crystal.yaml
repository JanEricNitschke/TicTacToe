# This workflow will run the tests on the crystal version of tictactoe

name: crystal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tictactoe_crystal
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Crystal
      uses: crystal-lang/install-crystal@46e48b6238ee23b1a6ef08ec39f12fb234676006 # v1.9.3
    - name: Check formatting
      run: crystal tool format --check
    - name: Build
      run: crystal build src/tictactoe_crystal.cr
    - name: Run tests
      run: crystal spec
    - name: Run
      run: crystal run src/tictactoe_crystal.cr -- --X-strength=4 --O-strength=4
