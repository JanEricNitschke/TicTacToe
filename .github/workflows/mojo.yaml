# This workflow will run the tests on the mojo version of tictactoe

name: Mojo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tictactoe_mojo
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          manifest-path: ./tictactoe_mojo/pixi.toml
      - name: Print effective target
        run: pixi run mojo build --print-effective-target main.mojo
      - name: Build
        run: pixi run mojo build --march=x86-64 main.mojo
      - name: Run
        run: ./main
      - name: Test
        run: pixi run mojo run --march=x86-64 -I . test/test_game.mojo
